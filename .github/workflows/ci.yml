name: SENFX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/senfx-one-pull-full-build]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check workspace links
        run: node scripts/check-workspace-routes.mjs
      - name: Run deterministic bot strategy tests
        run: npm run test:engine
      - name: Validate bot control state machine and RLS migration text
        run: npm run test:controls
      - name: Run paper-worker static and strategy tests
        run: npm run test:paper-worker
      - name: Exercise isolated paper worker Start to Stop lifecycle
        run: npm run test:worker-e2e
      - name: Test authenticated paper control API and cross-customer isolation
        run: npm run test:auth-controls
      - name: Check worker Node syntax
        run: node --check worker/senfx-customer-paper-worker.mjs
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production application
        run: npm run build

  paper-bot-control-database:
    name: Persistent paper bot command database smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_bot_controls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_bot_controls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare isolated Postgres roles and existing bot table shapes
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS 'SELECT NULLIF(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          CREATE TABLE public.bots(id uuid PRIMARY KEY, is_published boolean NOT NULL);
          CREATE TABLE public.customer_bots(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            selected boolean NOT NULL, control_status text NOT NULL
          );
          CREATE TABLE public.customer_bot_configurations(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            stake_amount numeric NOT NULL, daily_loss_limit numeric
          );
          GRANT USAGE ON SCHEMA auth,public TO authenticated,service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Run migration and rollback-only paper control tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-bot-controls.sql
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 -f supabase/tests/senfx-persistent-bot-controls-smoke-test.sql

  paper-worker-database:
    name: Persistent public-tick paper worker SQL smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_paper_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_paper_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible database skeleton
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS 'SELECT NULLIF(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          CREATE TABLE public.bots(
            id uuid PRIMARY KEY, name text NOT NULL, market text NOT NULL,
            is_published boolean NOT NULL
          );
          CREATE TABLE public.customer_bots(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            selected boolean NOT NULL, control_status text NOT NULL
          );
          CREATE TABLE public.customer_bot_configurations(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            stake_amount numeric NOT NULL, daily_loss_limit numeric
          );
          GRANT USAGE ON SCHEMA auth,public TO authenticated,service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply migrations and run risk lease and tenant-isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-paper-risk-controls.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-bot-controls.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-paper-worker.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-persistent-paper-worker-smoke-test.sql

  paper-worker-image:
    name: Minimal paper worker container and disabled startup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build worker-only Docker image
        run: docker build --file worker/Dockerfile --tag senfx-paper-worker:ci .
      - name: Verify worker stays disabled without any secrets
        run: |
          set -euo pipefail
          docker run --rm -e SENFX_PAPER_WORKER_ENABLED=false senfx-paper-worker:ci 2>&1 | tee worker-startup.log
          grep -q "paper worker is disabled" worker-startup.log

  paper-worker-runtime:
    name: Paper worker hermetic Start Pause Resume Stop integration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Exercise actual worker with fake public ticks and local API
        run: node --experimental-strip-types --test tests/paper-worker-runtime.test.mjs

  authenticated-gotrue:
    name: Real isolated Supabase Auth JWT + paper API authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotrue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gotrue_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Start isolated GoTrue Auth with disposable PostgreSQL
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d gotrue_ci \
            -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS auth;'
          docker run -d --name senfx-gotrue-ci --network host \
            -e GOTRUE_API_HOST=0.0.0.0 \
            -e PORT=9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_NAMESPACE=auth \
            -e GOTRUE_DB_DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/gotrue_ci?sslmode=disable' \
            -e GOTRUE_JWT_SECRET='SENFX-FAKE-CI-KEY-NOT-FOR-PRODUCTION-123456789' \
            -e GOTRUE_JWT_EXP=3600 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_SITE_URL=http://127.0.0.1:9999 \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            -e GOTRUE_LOG_LEVEL=info \
            supabase/auth:v2.176.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9999/health >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' senfx-gotrue-ci)" != "true" ]; then
              echo "Local GoTrue exited before becoming healthy."
              docker logs --tail 35 senfx-gotrue-ci
              exit 1
            fi
            sleep 2
          done
          echo "Local Supabase Auth did not become ready."
          docker logs --tail 80 senfx-gotrue-ci
          exit 1
      - name: Verify actual Auth JWTs across two isolated customer identities
        env:
          SENFX_TEST_REAL_AUTH_URL: http://127.0.0.1:9999
        run: node --experimental-strip-types --experimental-loader ./tests/auth-control/loader.mjs --test tests/auth-control/gotrue-route.test.mjs
      - name: Clean up disposable Auth test
        if: always()
        run: docker rm -f senfx-gotrue-ci >/dev/null 2>&1 || true
