name: SENFX validation

on:
  pull_request:
    branches: [main, feature/senfx-unified-workspace-release-20261118]
  push:
    branches: [main, feature/senfx-one-pull-full-build]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check workspace links
        run: node scripts/check-workspace-routes.mjs
      - name: Verify Quick Switch search and page destinations
        run: npm run test:workspace
      - name: Verify unified customer dashboard integrations
        run: npm run test:integration
      - name: Verify Phase 16 read-only evidence and role-gate regression checks
        run: node --test tests/phase16-workspace-evidence.test.mjs
      - name: Verify hosted automatic paper-bot Start and Pause launch paths
        run: node --test tests/hosted-paper-launch.test.mjs
      - name: Test observed-only market graphs and tick activity
        run: node --experimental-strip-types --test tests/market-session-analytics.test.mjs
      - name: Verify Digit Matrix scanner integrity and safe catalog controls
        run: node --experimental-strip-types --test tests/digit-matrix.test.mjs
      - name: Verify automatic digit bulk PAPER simulation and emergency Stop
        run: node --experimental-strip-types --test tests/digit-bulk-paper.test.mjs
      - name: Verify opt-in bot research filters and unchanged published paper rules
        run: node --experimental-strip-types --test tests/strategy-lab.test.mjs
      - name: Verify all 15 independent SENFX next-tick PAPER bot strategies and risk guards
        run: node --experimental-strip-types --test tests/fifteen-paper-bots.test.mjs
      - name: Check Start All 15 concurrent browser paper runner fail-closed behavior
        run: node --test tests/fifteen-parallel-paper-runner-source.test.mjs
      - name: Run deterministic bot strategy tests
        run: npm run test:engine
      - name: Verify operations deck fail-closed worker states
        run: npm run test:operations
      - name: Validate bot control state machine and RLS migration text
        run: npm run test:controls
      - name: Run paper-worker static and strategy tests
        run: npm run test:paper-worker
      - name: Exercise isolated paper worker Start to Stop lifecycle
        run: npm run test:worker-e2e
      - name: Test authenticated paper control API and cross-customer isolation
        run: npm run test:auth-controls
      - name: Validate operator-only production backup script syntax
        run: bash -n scripts/senfx-backup-production.sh
      - name: Check worker Node syntax
        run: node --check worker/senfx-customer-paper-worker.mjs
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production application
        run: npm run build

  paper-bot-control-database:
    name: Persistent paper bot command database smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_bot_controls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_bot_controls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare isolated Postgres roles and existing bot table shapes
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS 'SELECT NULLIF(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          CREATE TABLE public.bots(id uuid PRIMARY KEY, is_published boolean NOT NULL);
          CREATE TABLE public.customer_bots(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            selected boolean NOT NULL, control_status text NOT NULL
          );
          CREATE TABLE public.customer_bot_configurations(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            stake_amount numeric NOT NULL, daily_loss_limit numeric
          );
          GRANT USAGE ON SCHEMA auth,public TO authenticated,service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Run migration and rollback-only paper control tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-bot-controls.sql
          psql -h localhost -U postgres -d senfx_bot_controls -v ON_ERROR_STOP=1 -f supabase/tests/senfx-persistent-bot-controls-smoke-test.sql

  paper-worker-database:
    name: Persistent public-tick paper worker SQL smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_paper_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_paper_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible database skeleton
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS 'SELECT NULLIF(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          CREATE TABLE public.bots(
            id uuid PRIMARY KEY, name text NOT NULL, market text NOT NULL,
            is_published boolean NOT NULL
          );
          CREATE TABLE public.customer_bots(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            selected boolean NOT NULL, control_status text NOT NULL
          );
          CREATE TABLE public.customer_bot_configurations(
            customer_id uuid NOT NULL, bot_id uuid NOT NULL, trading_mode text NOT NULL,
            stake_amount numeric NOT NULL, daily_loss_limit numeric
          );
          GRANT USAGE ON SCHEMA auth,public TO authenticated,service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply migrations and run risk lease and tenant-isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-paper-risk-controls.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-paper-rollout-preflight.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-bot-controls.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-paper-worker.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-paper-rollout-postflight.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/senfx-digit-matrix-scanner-only-guard.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-digit-matrix-guard-smoke.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-persistent-paper-worker-smoke-test.sql
          psql -h localhost -U postgres -d senfx_paper_worker -v ON_ERROR_STOP=1 -f supabase/tests/senfx-three-bot-fleet-smoke-test.sql

  paper-worker-image:
    name: Minimal paper worker container and disabled startup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build worker-only Docker image
        run: docker build --file worker/Dockerfile --tag senfx-paper-worker:ci .
      - name: Verify worker stays disabled without any secrets
        run: |
          set -euo pipefail
          docker run --rm -e SENFX_PAPER_WORKER_ENABLED=false senfx-paper-worker:ci 2>&1 | tee worker-startup.log
          grep -q "paper worker is disabled" worker-startup.log

  paper-worker-runtime:
    name: Paper worker hermetic Start Pause Resume Stop integration
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Exercise actual worker lifecycle and public-feed failure recovery
        run: node --experimental-strip-types --test tests/paper-worker-runtime.test.mjs tests/paper-worker-feed-outage.test.mjs tests/paper-worker-three-market-runtime.test.mjs

  authenticated-gotrue:
    name: Real local Supabase Auth JWT + paper API authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Install official Supabase local stack CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Launch disposable local Supabase Auth and PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p /tmp/senfx-local-auth-ci
          cd /tmp/senfx-local-auth-ci
          supabase init --yes
          # Mailbox/Inbucket is not used: local Auth auto-confirms password signups.
          # Excluding it avoids hosted CI port 54324 collisions.
          supabase start -x studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor,inbucket
      - name: Verify signed identities through the real local Auth server
        run: |
          set -euo pipefail
          cd /tmp/senfx-local-auth-ci
          source <(supabase status -o env)
          export SENFX_TEST_REAL_AUTH_URL="${API_URL}/auth/v1"
          export SENFX_TEST_AUTH_ANON_KEY="${ANON_KEY}"
          cd "$GITHUB_WORKSPACE"
          node --experimental-strip-types --experimental-loader ./tests/auth-control/loader.mjs --test tests/auth-control/gotrue-route.test.mjs
      - name: Apply REAL paper control RLS migration in disposable local database
        run: |
          set -euo pipefail
          cd /tmp/senfx-local-auth-ci
          source <(supabase status -o env)
          cd "$GITHUB_WORKSPACE"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/auth-control/real-db-fixture.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/senfx-paper-risk-controls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-bot-controls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/senfx-persistent-paper-worker.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Verify real JWT-controlled PostgreSQL RLS and server-only RPC
        run: |
          set -euo pipefail
          cd /tmp/senfx-local-auth-ci
          source <(supabase status -o env)
          export SENFX_TEST_REAL_API_URL="${API_URL}"
          export SENFX_TEST_AUTH_ANON_KEY="${ANON_KEY}"
          export SENFX_TEST_AUTH_SERVICE_KEY="${SERVICE_ROLE_KEY}"
          cd "$GITHUB_WORKSPACE"
          node --test tests/auth-control/real-rls.test.mjs
      - name: Exercise actual child worker against REAL local Auth, PostgREST and SQL
        run: |
          set -euo pipefail
          cd /tmp/senfx-local-auth-ci
          source <(supabase status -o env)
          export SENFX_TEST_REAL_API_URL="${API_URL}"
          export SENFX_TEST_AUTH_ANON_KEY="${ANON_KEY}"
          export SENFX_TEST_AUTH_SERVICE_KEY="${SERVICE_ROLE_KEY}"
          cd "$GITHUB_WORKSPACE"
          node --experimental-strip-types --experimental-loader ./tests/auth-control/real-route-loader.mjs --test tests/auth-control/full-local-worker-e2e.test.mjs
      - name: Remove local Auth and PostgreSQL test stack
        if: always()
        run: |
          if [ -f /tmp/senfx-local-auth-ci/supabase/config.toml ]; then
            cd /tmp/senfx-local-auth-ci
            supabase stop --no-backup || true
          fi
