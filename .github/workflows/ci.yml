name: SENFX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/senfx-one-pull-full-build]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check workspace links
        run: node scripts/check-workspace-routes.mjs
      - name: Run deterministic bot strategy tests
        run: npm run test:engine
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production application
        run: npm run build

  demo-risk-database:
    name: Unlimited Demo database ledger test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Exercise Demo baseline, upgrade migration and safety controls in isolated PostgreSQL
        if: ${{ hashFiles('supabase/senfx-deriv-demo-execution.sql') != '' }}
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d senfx_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
          INSERT INTO auth.users(id) VALUES ('11111111-1111-4111-8111-111111111111');
          SQL
          psql -h localhost -U postgres -d senfx_ci -v ON_ERROR_STOP=1 -f supabase/senfx-deriv-demo-execution.sql
          psql -h localhost -U postgres -d senfx_ci -v ON_ERROR_STOP=1 -f supabase/senfx-deriv-demo-unlimited-learning.sql
          sed 's/REPLACE-WITH-TEST-USER-UUID/11111111-1111-4111-8111-111111111111/g' supabase/tests/senfx-deriv-demo-risk-smoke-test.sql |
            psql -h localhost -U postgres -d senfx_ci -v ON_ERROR_STOP=1
