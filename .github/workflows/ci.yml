name: SENFX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/senfx-one-pull-full-build]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript checks
        run: npm run typecheck
