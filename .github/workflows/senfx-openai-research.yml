name: SENFX OpenAI research isolation checks

on:
  push:
    branches:
      - feature/senfx-openai-research-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SENFX_OPENAI_RESEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install without running package scripts
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test all 15-bot OpenAI observation boundaries
        run: node --experimental-strip-types --test tests/senfx-openai-research.test.mjs
      - name: Regression-test original fifteen bot strategies
        run: node --experimental-strip-types --test tests/fifteen-paper-bots.test.mjs
      - name: TypeScript checks
        run: npm run typecheck
      - name: Next.js build with AI disabled
        run: npm run build
