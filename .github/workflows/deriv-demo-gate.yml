name: Deriv Demo safety gate
on:
  pull_request:
    paths:
      - 'lib/deriv/demo-execution-gate.mjs'
      - 'lib/deriv/demo-ai-signal.mjs'
      - 'tests/demo-ai-signal.test.mjs'
      - 'tests/deriv-demo-execution-gate.test.mjs'
      - 'tests/deriv-demo-account-allowlist.test.mjs'
      - 'tests/deriv-demo-variable-stake-source.test.mjs'
      - 'tests/deriv-demo-reservation-source.test.mjs'
      - 'tests/deriv-demo-readiness-source.test.mjs'
      - 'app/api/deriv/demo/readiness/route.ts'
      - 'tests/deriv-demo-one-dollar-postgres.sql'
      - 'tests/deriv-demo-auto-phase2-postgres.sql'
      - 'app/components/DemoAutoPilot.tsx'
      - 'lib/deriv/demo-ai-signal.d.mts'
      - 'tests/demo-auto-ui.test.mjs'
      - 'tests/demo-auto-feed-policy.test.mjs'
      - 'lib/deriv/demo-auto-feed-policy.mjs'
      - 'lib/deriv/demo-auto-feed-policy.d.mts'
      - 'supabase/senfx-deriv-demo-auto-phase2.sql'
      - 'tests/deriv-demo-legacy-backup-restore-qa.sh'
      - 'supabase/senfx-deriv-demo-one-dollar-stage-only.sql'
      - 'supabase/senfx-deriv-demo-safe-reservation.sql'
      - 'app/api/deriv/demo/orders/route.ts'
      - 'app/components/DemoTradingConsole.tsx'
      - 'supabase/senfx-deriv-demo-unlimited-pilot-draft.sql'
      - 'lib/deriv/demo-account-allowlist.mjs'
      - '.github/workflows/deriv-demo-gate.yml'
  workflow_dispatch:
jobs:
  fail-closed-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run broker safety gate tests (offline, no credentials)
        run: node --test tests/demo-auto-feed-policy.test.mjs tests/demo-auto-ui.test.mjs tests/demo-ai-signal.test.mjs tests/deriv-demo-execution-gate.test.mjs tests/deriv-demo-account-allowlist.test.mjs tests/deriv-demo-variable-stake-source.test.mjs tests/deriv-demo-reservation-source.test.mjs tests/deriv-demo-readiness-source.test.mjs

  isolated-postgres-reservation-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senfx_demo_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d senfx_demo_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: senfx_demo_qa
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client on the ephemeral runner
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply committed RPC and test single $1 virtual reservation fail-closed rules
        run: psql -X -v ON_ERROR_STOP=1 -f tests/deriv-demo-one-dollar-postgres.sql
      - name: Verify separately authorized second one-shot phase without rewriting trade history
        run: psql -X -v ON_ERROR_STOP=1 -f tests/deriv-demo-auto-phase2-postgres.sql
      - name: Two concurrent same-user orders cannot both reserve virtual risk
        shell: bash
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c \
            "select public.senfx_demo_reserve_order('00000000-0000-4000-8000-000000000007', '10000000-0000-4000-8000-000000000009')->>'allowed';" \
            > /tmp/demo-reservation-a.txt &
          first=$!
          psql -XAt -v ON_ERROR_STOP=1 -c \
            "select public.senfx_demo_reserve_order('00000000-0000-4000-8000-000000000007', '10000000-0000-4000-8000-000000000010')->>'allowed';" \
            > /tmp/demo-reservation-b.txt &
          second=$!
          wait "$first"
          wait "$second"
          cat /tmp/demo-reservation-a.txt /tmp/demo-reservation-b.txt
          test "$(grep -hxc true /tmp/demo-reservation-{a,b}.txt | awk -F: '{s+=$NF} END {print s+0}')" -eq 1
          test "$(grep -hxc false /tmp/demo-reservation-{a,b}.txt | awk -F: '{s+=$NF} END {print s+0}')" -eq 1
          psql -XAt -v ON_ERROR_STOP=1 -c "
            do \$verify\$
            begin
              if (select count(*) from public.deriv_demo_orders
                  where user_id='00000000-0000-4000-8000-000000000007'
                    and status='reserved') <> 1
                or (select reserved_loss from public.deriv_demo_daily_risk
                    where user_id='00000000-0000-4000-8000-000000000007') <> 1
              then
                raise exception 'Concurrent reservations exceeded the one-dollar limit';
              end if;
            end
            \$verify\$;
          "

      - name: Test disposable legacy backup, restore, $1 schema migration and rollback
        shell: bash
        run: bash tests/deriv-demo-legacy-backup-restore-qa.sh
